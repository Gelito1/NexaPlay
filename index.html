.plane{position:fixed;top:12%;left:-80px;font-size:34px;filter:drop-shadow(0 0 12px #ff3b3b);animation:fly 9s linear infinite;z-index:-1}

.pic{flex:0 1 auto;min-height:0;display:flex;justify-content:center;animation:float 5s ease-in-out infinite}
.pic img{max-height:76svh;max-width:100%;width:auto;height:auto;display:block;border-radius:28px;box-shadow:0 0 0 2px #ffffff40,0 24px 70px #000c,0 0 90px #ff2a2a88}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:15px 40px 15px 18px;border-radius:18px;background:linear-gradient(180deg,#fff2a8,#ffc61a 50%,#f59e00);color:#2a0c00;font:900 21px Impact,"Arial Black",sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;box-shadow:0 6px 0 #9a5a00,0 0 0 0 #ffc61a99;animation:ring 2s infinite}
.btn i{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#b30f16;color:#fff;font-style:normal;font-size:22px;transition:transform .3s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fffb,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a5a00}
@keyframes ring{70%{box-shadow:0 6px 0 #9a5a00,0 0 0 18px #ffc61a00}100%{box-shadow:0 6px 0 #9a5a00,0 0 0 0 #ffc61a00}}
@keyframes shine{to{left:130%}}
small{font-size:11px;color:#f0cfcf;text-align:center;max-width:520px;line-height:1.4}
small b{color:var(--gold)}
